# CI workflow for Chartly Finance Tracker
# - Installs dependencies
# - Runs build and tests
# - Caches node_modules to speed up runs

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (for headless tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium
        env:
          CHROME_BIN: /usr/bin/chromium

      - name: Build
        run: npm run build --if-present

      - name: Run tests (headless)
        env:
          CHROME_BIN: /usr/bin/chromium
        run: npm test --if-present -- --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Upload build artifact (optional)
        if: success() && (github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/**

# OPTIONAL: Add a deploy job below if you want to publish automatically (e.g. to GitHub Pages, Netlify, or other hosts)
# For GitHub Pages, you can add a separate job that uses peaceiris/actions-gh-pages
# Make sure to add required secrets (GITHUB_TOKEN is provided automatically, other providers require additional secrets)
